
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">TJ</span>
      <span>TRISTAN JOOS <small>SOFTWARE ENGINEERING</small></span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/about/' | relative_url }}">About & CV</a>
      <a class="nav-highlight" href="{{ '/#journal' | relative_url }}">Journal ↘</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <a class="brand footer-brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">TJ</span>
      <span>TRISTAN JOOS</span>
    </a>
    <span>BUILT WITH CURIOSITY · {{ site.time | date: "%Y" }}</span>
    <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GITHUB ↗</a>
  </footer>
</body>
</html>
